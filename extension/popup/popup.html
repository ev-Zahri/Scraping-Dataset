<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Social Stream Harvester</title>
  <link rel="stylesheet" href="popup.css"/>
</head>
<body>
  <div class="popup-container">
    <!-- Clean Minimalist Header -->
    <header class="header">
      <div class="header-left">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Social Harvester</span>
          <span class="brand-ver">v1.3</span>
        </div>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">IDLE</span>
      </div>
    </header>

    <!-- Platform Selection Grid (4x2 minimal) -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">PLATFORM</span>
        <span class="section-active-name" id="active-platform-name">X (Twitter)</span>
      </div>

      <div class="platform-grid" id="platform-grid">
        <!-- 1. X (Twitter) - AKTIF -->
        <div class="platform-card active" data-platform="twitter" title="X / Twitter (Aktif)">
          <div class="platform-icon"><img src="../icons/icons-x.png" alt="X"></div>
          <span class="platform-name">X</span>
        </div>

        <!-- 2. YouTube - AKTIF -->
        <div class="platform-card" data-platform="youtube" title="YouTube Komentar (Aktif)">
          <div class="platform-icon"><img src="../icons/icons-youtube.png" alt="YouTube"></div>
          <span class="platform-name">YouTube</span>
        </div>

        <!-- 3. Threads - AKTIF -->
        <div class="platform-card" data-platform="threads" title="Threads (Aktif)">
          <div class="platform-icon"><img src="../icons/icons-threads.png" alt="Threads"></div>
          <span class="platform-name">Threads</span>
        </div>

        <!-- 4. TikTok - AKTIF -->
        <div class="platform-card" data-platform="tiktok" title="TikTok Komentar (Aktif)">
          <div class="platform-icon"><img src="../icons/icons-tiktok.png" alt="TikTok"></div>
          <span class="platform-name">TikTok</span>
        </div>

        <!-- 5. Shopee - AKTIF -->
        <div class="platform-card" data-platform="shopee" title="Shopee Ulasan Produk (Aktif)">
          <div class="platform-icon"><img src="../icons/icons-shopee.png" alt="Shopee"></div>
          <span class="platform-name">Shopee</span>
        </div>

        <!-- 6. Reddit -->
        <div class="platform-card disabled" data-platform="reddit" title="Reddit (Segera)">
          <div class="platform-icon"><img src="../icons/icons-reddit.png" alt="Reddit"></div>
          <span class="platform-name">Reddit</span>
        </div>

        <!-- 7. Facebook -->
        <div class="platform-card disabled" data-platform="facebook" title="Facebook (Segera)">
          <div class="platform-icon"><img src="../icons/icons-facebook.png" alt="Facebook"></div>
          <span class="platform-name">Facebook</span>
        </div>

        <!-- 8. Tokopedia -->
        <div class="platform-card disabled" data-platform="tokopedia" title="Tokopedia (Segera)">
          <div class="platform-icon"><img src="../icons/icons-tokopedia.png" alt="Tokopedia"></div>
          <span class="platform-name">Tokopedia</span>
        </div>
      </div>
    </section>

    <!-- Monitor Card -->
    <section class="monitor-card">
      <div class="monitor-top">
        <span class="monitor-label">STATUS AKTIF</span>
        <span class="monitor-badge" id="page-detect-badge">Memeriksa tab...</span>
      </div>
      <div class="monitor-body">
        <div class="stat-col">
          <span class="stat-val" id="count-responses">0</span>
          <span class="stat-desc" id="stat-name-1">Data Terkumpul</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-col">
          <span class="stat-val" id="count-tweets">0</span>
          <span class="stat-desc" id="stat-name-2">Estimasi Item</span>
        </div>
      </div>
      <div class="monitor-foot" id="monitor-hint">
        Pilih platform target atau klik Scan untuk membaca data tab aktif.
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="actions">
      <!-- Tombol Scan Tab Seketika -->
      <button type="button" class="btn btn-scan" id="btn-scan-now">
        <span id="btn-scan-text">Scan Tab Aktif (Tanpa Reload)</span>
      </button>

      <div class="btn-group-main">
        <button type="button" class="btn btn-primary" id="btn-toggle-capture">
          <span id="btn-toggle-text">Mulai Capture</span>
        </button>
        <button type="button" class="btn btn-secondary" id="btn-save-json" disabled>
          <span>Simpan JSON</span>
        </button>
      </div>

      <div class="btn-group-sub">
        <button type="button" class="btn-ghost" id="btn-clear-buffer">
          <span>Reset Buffer</span>
        </button>
        <button type="button" class="btn-ghost" id="btn-open-dashboard">
          <span>Buka Dashboard &nearr;</span>
        </button>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
